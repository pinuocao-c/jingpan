name: Windows Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build application
        run: npm run build

      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: npm run check:release-notes

      - name: Build Windows installer
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: npm run dist

      - name: Upload application build
        uses: actions/upload-artifact@v7
        with:
          name: jingpan-app-${{ github.sha }}
          path: out/
          if-no-files-found: error

      - name: Upload Windows installer
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: jingpan-windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = $utf8
          [Console]::OutputEncoding = $utf8
          $OutputEncoding = $utf8

          $notesFile = Join-Path $PWD "RELEASE_NOTES.md"
          if (-not (Test-Path -LiteralPath $notesFile -PathType Leaf)) {
            throw "Release notes file not found: $notesFile"
          }

          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit "${{ github.ref_name }}" --title "净盘 ${{ github.ref_name }}" --notes-file "$notesFile"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update release notes."
            }

            gh release upload "${{ github.ref_name }}" release/*.exe --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload release assets."
            }
          } else {
            gh release create "${{ github.ref_name }}" release/*.exe --title "净盘 ${{ github.ref_name }}" --notes-file "$notesFile"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release."
            }
          }
